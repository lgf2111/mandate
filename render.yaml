services:
  - type: web
    name: mandate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: MANDATE_LLM_BASE_URL
        sync: false
      - key: MANDATE_LLM_API_KEY
        sync: false
      - key: MANDATE_LLM_MODEL
        value: deepseek-v4.1-flash
